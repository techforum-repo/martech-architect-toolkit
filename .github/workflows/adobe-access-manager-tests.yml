name: adobe-access-manager tests

on:
  push:
    branches: [main]
    paths: ["adobe-access-manager/**", ".github/workflows/adobe-access-manager-tests.yml"]
  pull_request:
    paths: ["adobe-access-manager/**", ".github/workflows/adobe-access-manager-tests.yml"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adobe-access-manager
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: adobe-access-manager/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          # Tests run entirely against the mock Adobe client and a temp SQLite
          # file per test — no real credentials are needed or used.
          MOCK_ADOBE: "true"
